<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Operacional</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0B0D10;
  --panel:#13161B;
  --panel-2:#191D23;
  --border:#262B33;
  --border-soft:#1D2128;
  --text:#E7E9EC;
  --text-dim:#8B929D;
  --text-faint:#5B6270;
  --accent:#C98A3D;
  --accent-dim:#8C6230;
  --accent-soft:rgba(201,138,61,0.14);
  --danger:#C4554A;
  --danger-soft:rgba(196,85,74,0.14);
  --ok:#5C9A6B;
  --radius:3px;
  --font-ui:'Space Grotesk',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-soft);}

button{cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
}

#app{ height:100vh; display:flex; flex-direction:column; }

header.topbar{
  display:flex; align-items:center; gap:14px; padding:0 18px;
  height:52px; min-height:52px; background:var(--panel);
  border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:nowrap; overflow-x:auto;
}
.brand{ display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
.brand-mark{ font-weight:700; font-size:15px; letter-spacing:0.02em; }
.brand-sep{color:var(--text-faint);}
.battalion-input{
  background:transparent; border:1px solid transparent; color:var(--text-dim);
  font-size:13px; padding:4px 6px; border-radius:var(--radius); width:190px;
  transition:border-color .12s, background .12s;
}
.battalion-input:hover{border-color:var(--border);}
.battalion-input:focus{background:var(--panel-2);border-color:var(--border);color:var(--text);}

.map-switch{display:flex;align-items:center;gap:6px;margin-left:4px;padding-left:14px;border-left:1px solid var(--border-soft); white-space:nowrap;}
.map-select{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  padding:6px 8px; border-radius:var(--radius); font-size:12.5px; max-width:150px;
}
.btn.icon-only{width:30px;padding:0;justify-content:center;}

.topbar-spacer{flex:1;min-width:8px;}
.topbar-actions{display:flex;gap:8px;align-items:center;white-space:nowrap;}

.btn{
  display:inline-flex; align-items:center; gap:6px; background:var(--panel-2);
  border:1px solid var(--border); color:var(--text); padding:7px 12px;
  border-radius:var(--radius); font-size:13px; font-weight:500; line-height:1;
  transition:border-color .12s, background .12s, color .12s; white-space:nowrap;
}
.btn:hover{border-color:#3A4150;background:#1E232A;}
.btn:active{background:#161A20;}
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#1A1204; font-weight:600; }
.btn.primary:hover{background:#DE9B48;border-color:#DE9B48;}
.btn.danger{color:var(--danger);}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft);}
.btn.ghost{background:transparent;}
.btn.small{padding:5px 9px;font-size:12px;}
.btn.active-toggle{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn svg{width:14px;height:14px;flex-shrink:0;}

.layout{ flex:1; display:flex; min-height:0; }

.sidebar{
  width:280px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.sidebar-section{ padding:14px 14px 12px; border-bottom:1px solid var(--border-soft); }
.search-input{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  padding:8px 10px; border-radius:var(--radius); font-size:13px;
}
.search-input::placeholder{color:var(--text-faint);}

.section-label{
  font-size:11px; color:var(--text-faint); margin-bottom:8px;
  display:flex; justify-content:space-between; align-items:center;
}
.cat-filter-row{
  display:flex; align-items:center; gap:8px; padding:5px 2px;
  border-radius:var(--radius); cursor:pointer; font-size:13px;
}
.cat-filter-row:hover{background:var(--panel-2);}
.cat-check{
  width:14px;height:14px; border:1.5px solid var(--border); border-radius:2px;
  flex-shrink:0; display:flex;align-items:center;justify-content:center;
}
.cat-check.checked{background:var(--accent);border-color:var(--accent);}
.cat-check.checked svg{width:10px;height:10px;color:#1A1204;}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cat-filter-name{flex:1;color:var(--text);}
.cat-filter-count{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}
.layer-divider{height:1px;background:var(--border-soft);margin:6px 0;}

.point-list{ flex:1; overflow-y:auto; padding:6px 8px; }
.point-row{
  display:flex; align-items:center; gap:9px; padding:8px 8px;
  border-radius:var(--radius); cursor:pointer; border:1px solid transparent;
}
.point-row:hover{background:var(--panel-2);}
.point-row.active{background:var(--accent-soft);border-color:var(--accent-dim);}
.point-icon-sm{
  width:22px;height:22px; border-radius:50%; display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.point-icon-sm svg{width:12px;height:12px;}
.point-row-text{min-width:0;flex:1;}
.point-row-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.point-row-cat{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty-hint{padding:18px 10px;color:var(--text-faint);font-size:12.5px;line-height:1.6;text-align:center;}

.map-area{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; background:#08090B; }
.toolbar{
  display:flex; align-items:center; gap:6px; padding:9px 14px;
  border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0; flex-wrap:wrap;
}
.toolbar-group{display:flex;gap:2px;background:var(--panel-2);padding:2px;border-radius:var(--radius);border:1px solid var(--border);}
.tool-btn{
  display:flex;align-items:center;gap:6px; background:transparent;border:none;color:var(--text-dim);
  padding:6px 11px;border-radius:2px;font-size:12.5px;font-weight:500;
}
.tool-btn svg{width:14px;height:14px;}
.tool-btn:hover{color:var(--text);}
.tool-btn.active{background:var(--accent);color:#1A1204;}
.toolbar-hint{ font-size:12px;color:var(--text-faint);margin-left:8px; font-family:var(--font-mono); }
.toolbar-spacer{flex:1;}

.map-viewport{
  flex:1; overflow:auto; position:relative;
  background: radial-gradient(circle at 50% 50%, #0F1115 0%, #08090B 70%);
}
.map-canvas{ position:relative; margin:40px; background:#0E1013; }
/* A "janela" do iframe (o próprio elemento <iframe>) nunca é transformada —
   fica sempre fixa preenchendo o canvas. Quem se move durante o arraste é
   somente a camada de conteúdo (#overlayLayers: pontos, ruas, bairros),
   dentro de .overlay-layers logo abaixo. Isso evita o iframe "vazar" para
   fora da área visível durante o pan e elimina o repaint pesado de
   transformar um <iframe> inteiro a cada frame. */
.map-canvas img{ display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; pointer-events:none; position:absolute; top:0; left:0; }
.map-canvas iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; display:block; background:#0E1013; transform:translateZ(0); }
.map-canvas .bg-hidden{ display:none !important; }
.overlay-layers{ position:absolute; top:0; left:0; width:100%; height:100%; will-change:transform; }
/* Durante o arraste (classe .panning) o transform segue o mouse 1:1, sem
   suavização, para não parecer "borrachudo". Ao soltar, a câmera real já
   foi recalculada e as camadas já foram re-renderizadas na posição final,
   então o transform é zerado imediatamente — sem esperar o iframe recarregar. */
.overlay-layers:not(.panning){ transition:transform .12s ease-out; }
/* Mapas com fundo Google My Maps preenchem toda a área visível do
   viewport (proporcional à tela real), em vez de um retângulo de tamanho
   fixo em pixels dentro de uma área rolável. */
.map-viewport.embed-fill{ overflow:hidden; }
.map-canvas.embed-fill{ position:absolute; inset:0; margin:0; width:100% !important; height:100% !important; }
.map-canvas.mode-add-point{cursor:crosshair;}
.map-canvas.mode-draw-street{cursor:crosshair;}
.map-canvas.mode-select{cursor:grab;}
.map-canvas.panning{cursor:grabbing;}
.map-canvas.embed-locked iframe{pointer-events:none;}
.map-canvas.embed-interactive iframe{pointer-events:auto;}

svg.overlay{ position:absolute;top:0;left:0; width:100%;height:100%; pointer-events:none; }
svg.overlay.layer-hidden{display:none;}
svg.overlay .street{
  fill:none; stroke:#D8DBE0; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
  opacity:0.85; pointer-events:stroke; cursor:pointer;
}
svg.overlay .street:hover{stroke:#F2F4F6;opacity:1;}
svg.overlay .street.selected{stroke:var(--accent);opacity:1;stroke-width:4;}
svg.overlay .street-hit{ fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer; }
svg.overlay .draft-street{ fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5; }
svg.overlay .vertex-handle{ fill:#0B0D10;stroke:var(--accent);stroke-width:2; pointer-events:all;cursor:grab; }
svg.overlay .bairro{ fill:rgba(140,98,48,0.16); stroke:#C98A3D; stroke-width:2.25; pointer-events:none; }
svg.overlay .bairro.selected{ stroke:#F2B463; fill:rgba(201,138,61,0.26); stroke-width:3; }
svg.overlay .bairro-hit{ fill:rgba(0,0,0,0.001); stroke:none; pointer-events:fill; cursor:pointer; }
svg.overlay .bairro-label{ font-family:var(--font-mono); font-size:13px; font-weight:500; fill:#F1F2F4; pointer-events:none; paint-order:stroke; stroke:#0B0D10; stroke-width:3.5px; stroke-linejoin:round; }
svg.overlay .bairro-label-sub{ font-family:var(--font-mono); font-size:11px; fill:#D8CBB5; pointer-events:none; paint-order:stroke; stroke:#0B0D10; stroke-width:3px; stroke-linejoin:round; }

.markers-layer{ position:absolute;top:0;left:0; width:100%;height:100%; pointer-events:none; }
.marker{ position:absolute; width:0;height:0; cursor:pointer; user-select:none; pointer-events:auto; }
.marker-pin{
  position:absolute; left:0;top:0; transform:translate(-50%,-50%); width:22px;height:22px;
  border-radius:50%; display:flex;align-items:center;justify-content:center;
  border:2px solid #0B0D10; box-shadow:0 0 0 2px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.55); z-index:2;
}
.marker-pin svg{width:12px;height:12px;}
.marker.selected .marker-pin{outline:2px solid #fff;outline-offset:2px;}
.marker-label{
  position:absolute; left:0;top:15px; transform:translateX(-50%); font-size:10.5px;
  background:rgba(11,13,16,0.88); border:1px solid var(--border); padding:1px 6px; border-radius:2px;
  color:var(--text-dim); white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis;
  pointer-events:none; z-index:1;
}

.zoom-controls{
  position:absolute; right:18px;bottom:18px; display:flex;flex-direction:column;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; z-index:5;
}
.zoom-controls button{
  width:32px;height:32px; background:transparent;border:none;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center; border-bottom:1px solid var(--border-soft);
}
.zoom-controls button:last-child{border-bottom:none;}
.zoom-controls button:hover{background:var(--panel-2);color:var(--text);}
.zoom-controls svg{width:15px;height:15px;}
.zoom-level{
  position:absolute; right:18px;bottom:150px; font-family:var(--font-mono); font-size:11px;
  color:var(--text-faint); background:var(--panel); border:1px solid var(--border); padding:3px 7px; border-radius:var(--radius); z-index:5;
}
.embed-help{
  position:absolute; left:18px; right:18px; bottom:18px; z-index:6;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:rgba(19,22,27,0.96); border:1px solid var(--accent-dim);
  color:var(--text-dim); font-size:12px; line-height:1.5;
  padding:10px 12px; border-radius:var(--radius);
}
.embed-help.hidden{display:none;}
.embed-help strong{color:var(--text);font-weight:600;}
.embed-help .btn{flex-shrink:0;}
.embed-help-close{
  margin-left:auto; background:transparent;border:none;color:var(--text-faint);
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.embed-help-close:hover{color:var(--text);}
.embed-help-close svg{width:13px;height:13px;}
/* O nome do mapa ativo não fica mais flutuando sobre o canvas (onde cobria
   pontos e ruas no canto superior esquerdo) — agora vive fixo na barra de
   ferramentas, acima da área de mapa, sem sobrepor nada. */
.map-badge{
  font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
  background:var(--panel-2); border:1px solid var(--border);
  padding:6px 10px; border-radius:var(--radius); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:280px; flex-shrink:0;
}
@media (max-width:860px){ .map-badge{ max-width:120px; } }

.draft-controls{
  position:absolute; left:50%;top:16px; transform:translateX(-50%); display:flex;gap:8px;
  background:var(--panel); border:1px solid var(--accent-dim); padding:7px 9px; border-radius:var(--radius);
  align-items:center; font-size:12.5px; box-shadow:0 4px 14px rgba(0,0,0,0.4); z-index:6;
}

.drawer-backdrop{
  position:fixed;inset:0; background:rgba(0,0,0,0.35); z-index:40; opacity:0;pointer-events:none; transition:opacity .15s;
}
.drawer-backdrop.show{opacity:1;pointer-events:all;}
.drawer{
  position:fixed; top:0;right:0;bottom:0; width:380px; background:var(--panel); border-left:1px solid var(--border);
  z-index:41; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .18s ease;
  box-shadow:-8px 0 24px rgba(0,0,0,0.35);
}
.drawer.show{transform:translateX(0);}
.drawer-head{ display:flex;align-items:center;gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
.drawer-head-icon{ width:28px;height:28px;border-radius:50%; display:flex;align-items:center;justify-content:center;flex-shrink:0; }
.drawer-head-icon svg{width:14px;height:14px;}
.drawer-title{font-weight:600;font-size:14px;flex:1;min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.drawer-close{
  background:transparent;border:none;color:var(--text-faint); width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;border-radius:var(--radius); flex-shrink:0;
}
.drawer-close:hover{background:var(--panel-2);color:var(--text);}
.drawer-close svg{width:16px;height:16px;}
.drawer-body{ flex:1;overflow-y:auto;padding:16px; display:flex;flex-direction:column;gap:14px; }
.field-label{ font-size:11px;color:var(--text-faint);margin-bottom:5px;display:block; }
.field-hint{ font-size:11px;color:var(--text-faint); margin-top:4px; line-height:1.5; }
.field-input,.field-textarea,.field-select{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  padding:8px 10px; border-radius:var(--radius); font-size:13px;
}
.field-textarea{resize:vertical;min-height:76px;line-height:1.5;}
.field-mono{font-family:var(--font-mono);font-size:12px;}
.field-row{display:flex;gap:8px;}
.field-row .field{flex:1;min-width:0;}
.maps-row{display:flex;gap:6px;}
.maps-row .field-input{flex:1;}

.photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.photo-thumb{ position:relative; aspect-ratio:1; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); background:var(--panel-2); }
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
.photo-remove{
  position:absolute;top:3px;right:3px; width:18px;height:18px; background:rgba(11,13,16,0.85);
  border:1px solid var(--border); border-radius:50%; display:flex;align-items:center;justify-content:center; color:var(--text-dim);
}
.photo-remove svg{width:10px;height:10px;}
.photo-remove:hover{color:var(--danger);}
.photo-add{
  aspect-ratio:1; border:1.5px dashed var(--border); border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center; color:var(--text-faint); background:transparent;
}
.photo-add:hover{border-color:var(--accent-dim);color:var(--text-dim);}
.photo-add svg{width:18px;height:18px;}

.meta-row{ display:flex;justify-content:space-between; font-size:11px;color:var(--text-faint); font-family:var(--font-mono); padding-top:2px; }
.drawer-footer{ padding:14px 16px; border-top:1px solid var(--border); display:flex;gap:8px; flex-shrink:0; }
.drawer-footer .btn{flex:1;justify-content:center;}

.modal-backdrop{
  position:fixed;inset:0; background:rgba(5,6,8,0.6); display:flex;align-items:center;justify-content:center;
  z-index:60; padding:20px;
}
.modal{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  width:460px; max-width:100%; max-height:85vh; display:flex;flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,0.5);
}
.modal.wide{width:680px;}
.modal-head{ display:flex;align-items:center; padding:14px 16px;border-bottom:1px solid var(--border); flex-shrink:0; gap:10px; }
.modal-title{font-weight:600;font-size:14px;flex:1;}
.modal-body{padding:16px;overflow-y:auto;flex:1;}
.modal-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}
.modal-close{
  background:transparent;border:none;color:var(--text-faint); width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;border-radius:var(--radius); flex-shrink:0;
}
.modal-close:hover{background:var(--panel-2);color:var(--text);}
.modal-close svg{width:16px;height:16px;}

.cat-row{ display:flex;align-items:center;gap:8px; padding:9px 0; border-bottom:1px solid var(--border-soft); }
.cat-row:last-child{border-bottom:none;}
.color-input{ width:30px;height:30px; border:1px solid var(--border); border-radius:50%; background:none; padding:0; overflow:hidden; flex-shrink:0; }
.color-input::-webkit-color-swatch-wrapper{padding:0;}
.color-input::-webkit-color-swatch{border:none;border-radius:50%;}
.icon-select{ width:74px;flex-shrink:0; }
.cat-name-input{flex:1;min-width:0;}
.icon-remove-btn{
  background:transparent;border:none;color:var(--text-faint); width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;border-radius:var(--radius); flex-shrink:0;
}
.icon-remove-btn:hover{color:var(--danger);background:var(--danger-soft);}
.icon-remove-btn svg{width:14px;height:14px;}
.cat-count-hint{font-size:10.5px;color:var(--text-faint);white-space:nowrap;}

.bairro-mgmt-row{ display:flex;align-items:center;gap:8px; padding:9px 0; border-bottom:1px solid var(--border-soft); }
.bairro-mgmt-row:last-child{border-bottom:none;}
.bairro-mgmt-name{flex:1;min-width:0;}
.bairro-mgmt-pop{width:110px;flex-shrink:0;}
.bairro-mgmt-status{font-size:10.5px; font-family:var(--font-mono); white-space:nowrap; width:78px; flex-shrink:0;}
.bairro-mgmt-status.has-shape{color:var(--ok);}
.bairro-mgmt-status.no-shape{color:var(--text-faint);}

.map-mgmt-card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:10px; background:var(--panel-2); }
.map-mgmt-card:last-child{margin-bottom:0;}
.map-mgmt-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.map-mgmt-head .field-input{flex:1;}
.map-mgmt-grid{ display:flex; flex-direction:column; gap:8px; }
.bg-mode-row{ display:flex; gap:6px; }
.bg-mode-btn{
  flex:1; text-align:center; padding:6px 8px; border-radius:var(--radius); border:1px solid var(--border);
  background:var(--panel); color:var(--text-dim); font-size:12px; cursor:pointer;
}
.bg-mode-btn.active{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent);}
.map-mgmt-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }

<script>
'use strict';

/* ================= Placeholder de mapa (SVG leve, usado só se não houver embed nem imagem) ================= */
function buildPlaceholder(label){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1143" viewBox="0 0 1400 1143">'
    + '<rect width="1400" height="1143" fill="#12141a"/>'
    + '<g stroke="#232732" stroke-width="1">';
  for(var x=0; x<=1400; x+=70){ svg += '<line x1="'+x+'" y1="0" x2="'+x+'" y2="1143"/>'; }
  for(var y=0; y<=1143; y+=70){ svg += '<line x1="0" y1="'+y+'" x2="1400" y2="'+y+'"/>'; }
  svg += '</g>'
    + '<rect x="420" y="500" width="560" height="150" rx="4" fill="#191d23" stroke="#31374a"/>'
    + '<text x="700" y="555" font-family="monospace" font-size="24" fill="#8B929D" text-anchor="middle">' + label + '</text>'
    + '<text x="700" y="590" font-family="monospace" font-size="14" fill="#5B6270" text-anchor="middle">sem plano de fundo definido</text>'
    + '<text x="700" y="614" font-family="monospace" font-size="14" fill="#5B6270" text-anchor="middle">use "Mapas" para colar o link do Google My Maps ou subir uma imagem</text>'
    + '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const MAP_W_DEFAULT = 1400, MAP_H_DEFAULT = 1143;

/* ================= Câmera geográfica (Google My Maps) =================
   Em vez de fixar pontos/ruas/bairros em pixels da tela, mapas com fundo
   "embed" (Google My Maps) guardam também latitude/longitude reais. A
   câmera (centro lat/lng + zoom) é controlada pelo próprio app — nunca
   pelo arrastar/zoom nativo do iframe do Google (que é de outra origem e
   não pode ser lido por JavaScript). Assim, ao usar os controles de zoom
   e o arraste do app, tudo (fundo + camadas) se reprojeta junto e
   preserva a localização real de cada item. */
const DEFAULT_CAMERA = {lat:-27.1536, lng:-48.5190, zoom:13}; // Porto Belo / Bombinhas — SC — usado só quando não há posição definida
/* Câmera antiga (Chapecó), incorreta — usada para migrar automaticamente
   estados já salvos no navegador que ficaram presos nessa posição por
   nunca terem tido um ll=/z= customizado. */
const LEGACY_DEFAULT_CAMERA = {lat:-27.0965, lng:-52.6183};
function isLegacyDefaultCamera(cam){
  return !!cam && typeof cam.lat==='number' && typeof cam.lng==='number'
    && Math.abs(cam.lat-LEGACY_DEFAULT_CAMERA.lat)<0.01
    && Math.abs(cam.lng-LEGACY_DEFAULT_CAMERA.lng)<0.01;
}
const MERC_TILE = 256;
function ll2world(lat,lng){
  const siny = Math.min(Math.max(Math.sin(lat*Math.PI/180), -0.9999), 0.9999);
  return {
    x: MERC_TILE*(0.5 + lng/360),
    y: MERC_TILE*(0.5 - Math.log((1+siny)/(1-siny))/(4*Math.PI))
  };
}
function world2ll(x,y){
  const lng = (x/MERC_TILE - 0.5)*360;
  const n = Math.PI - 2*Math.PI*(y/MERC_TILE);
  const lat = 180/Math.PI * Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return {lat:lat, lng:lng};
}
/* lat/lng -> posição em pixels "de mapa" (mesmo espaço 0..d.w / 0..d.h usado por x,y) */
function llToMapXY(lat,lng,camera,w,h){
  const scale = Math.pow(2, camera.zoom);
  const c = ll2world(camera.lat, camera.lng);
  const p = ll2world(lat, lng);
  return { x: w/2 + (p.x-c.x)*scale, y: h/2 + (p.y-c.y)*scale };
}
/* posição em pixels "de mapa" -> lat/lng */
function mapXYToLL(x,y,camera,w,h){
  const scale = Math.pow(2, camera.zoom);
  const c = ll2world(camera.lat, camera.lng);
  const wx = c.x + (x-w/2)/scale;
  const wy = c.y + (y-h/2)/scale;
  return world2ll(wx,wy);
}
/* extrai ll=/z= de um link de embed, se já estiverem presentes */
function parseCameraFromEmbed(embedUrl){
  if(!embedUrl) return null;
  const ll = embedUrl.match(/[?&]ll=(-?\d+(?:\.\d+)?)[,\s](-?\d+(?:\.\d+)?)/i);
  const z = embedUrl.match(/[?&]z=(\d+(?:\.\d+)?)/i);
  if(ll){ return {lat:parseFloat(ll[1]), lng:parseFloat(ll[2]), zoom: z?parseFloat(z[1]):DEFAULT_CAMERA.zoom}; }
  return null;
}
/* monta o src do iframe sempre com ll=/z= da câmera atual do mapa */
function buildEmbedSrc(m){
  const base = normalizeEmbedUrl(m.embedUrl);
  if(!base) return '';
  const cam = (m.camera && typeof m.camera.lat==='number') ? m.camera : DEFAULT_CAMERA;
  try{
    const u = new URL(base);
    u.searchParams.set('ll', cam.lat.toFixed(6)+','+cam.lng.toFixed(6));
    u.searchParams.set('z', String(Math.round(cam.zoom)));
    return u.toString();
  }catch(e){ return base; }
}
function activeIsEmbed(){
  const m = getActiveMap();
  return !!(m && m.backgroundMode==='embed' && m.camera);
}
/* lat/lng correspondente a um ponto (x,y) do mapa ativo, só quando o fundo é o Google My Maps */
function currentMapLL(x,y){
  const m = getActiveMap();
  if(m && m.backgroundMode==='embed' && m.camera){
    const d = mapDims();
    return mapXYToLL(x,y,m.camera,d.w,d.h);
  }
  return null;
}
/* posição de exibição de um item (ponto/vértice): reprojeta a partir de lat/lng
   quando o fundo é o Google My Maps; senão usa x,y gravados normalmente */
function displayXY(obj, d, camera, isEmbed){
  if(isEmbed && camera && typeof obj.lat==='number' && typeof obj.lng==='number'){
    return llToMapXY(obj.lat, obj.lng, camera, d.w, d.h);
  }
  return {x:obj.x, y:obj.y};
}
function reloadEmbedFrame(){
  const m = getActiveMap();
  if(!m || m.backgroundMode!=='embed') return;
  const iframe = document.getElementById('mapEmbedFrame');
  const src = buildEmbedSrc(m);
  iframe.src = src;
  iframe.setAttribute('data-src', src);
}

/* ================= Ícones ================= */
const ICONS = {
  house: '<path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/>',
  alert: '<path d="M12 4L3 20h18L12 4z"/><path d="M12 10.5v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/>',
  star: '<path d="M12 3.5l2.55 5.4 5.95.75-4.4 4.15 1.15 5.9L12 16.9l-5.25 2.8 1.15-5.9-4.4-4.15 5.95-.75L12 3.5z" stroke-linejoin="round"/>',
  camera: '<path d="M4 8h3l1.5-2.2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/>',
  car: '<path d="M4 16.5V12l2-5h12l2 5v4.5"/><path d="M4 16.5h16M6.5 16.5v2M17.5 16.5v2"/><circle cx="7.3" cy="16.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="16.7" cy="16.5" r="1.2" fill="currentColor" stroke="none"/>',
  flag: '<path d="M6 21V4"/><path d="M6 5l12-1.5v11L6 16"/>',
  shield: '<path d="M12 3.5l7 2.7v5.3c0 5-3 8.2-7 9.5-4-1.3-7-4.5-7-9.5V6.2l7-2.7z"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none"/>'
};
const ICON_LABELS = {house:'Casa', alert:'Alerta', star:'Estrela', camera:'Câmera', car:'Viatura', flag:'Bandeira', shield:'Escudo', target:'Alvo'};
const ICON_KEYS = Object.keys(ICONS);
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function iconSvg(key){
  const inner = ICONS[key] || ICONS.house;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' + inner + '</svg>';
}
function iconOptions(selected){
  return ICON_KEYS.map(function(k){ return '<option value="'+k+'" '+(k===selected?'selected':'')+'>'+ICON_LABELS[k]+'</option>'; }).join('');
}
function contrastColor(hex){
  const c = hexToRgb(hex);
  if(!c) return '#0B0D10';
  const lum = (0.299*c.r + 0.587*c.g + 0.114*c.b)/255;
  return lum > 0.58 ? '#12141A' : '#F4F5F7';
}
function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
  return m ? {r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16)} : null;
}

/* ================= Utils ================= */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, function(s){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]; });
}
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    const pad = function(n){ return String(n).padStart(2,'0'); };
    return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }catch(e){ return '—'; }
}
function fmtPop(n){
  if(n===null || n===undefined || n==='') return 'sem dado';
  const num = Number(n);
  if(isNaN(num)) return 'sem dado';
  return num.toLocaleString('pt-BR') + ' hab.';
}
function fileToDataUrl(file){
  return new Promise(function(resolve,reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error('Falha ao ler arquivo')); };
    r.readAsDataURL(file);
  });
}
function downscaleImage(dataUrl, maxDim){
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w<=maxDim && h<=maxDim){ resolve({url:dataUrl, w:w, h:h}); return; }
      const scale = maxDim / Math.max(w,h);
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve({url:cv.toDataURL('image/jpeg', 0.85), w:w, h:h});
    };
    img.onerror = function(){ resolve({url:dataUrl, w:MAP_W_DEFAULT, h:MAP_H_DEFAULT}); };
    img.src = dataUrl;
  });
}

/* Aceita: <iframe src="...">, um link de "embed" pronto, ou o link de compartilhamento/edição
   do My Maps (…/maps/d/u/0/edit?mid=XXX&usp=sharing) — este último é convertido automaticamente
   para o formato de incorporação (…/maps/d/u/0/embed?mid=XXX). */
function normalizeEmbedUrl(value){
  const v = (value||'').trim();
  if(!v) return '';
  const iframeMatch = v.match(/src=["']([^"']+)["']/i);
  let url = iframeMatch ? iframeMatch[1] : v;

  const editMatch = url.match(/\/maps\/d\/(?:u\/\d+\/)?(?:edit|viewer)\?([^#]*)/i);
  if(editMatch){
    const params = new URLSearchParams(editMatch[1]);
    const mid = params.get('mid');
    if(mid){
      url = 'https://www.google.com/maps/d/u/0/embed?mid=' + encodeURIComponent(mid) + '&ehbc=2E312F&noprof=1';
    }
  } else {
    const embedMatch = url.match(/\/maps\/d\/(?:u\/\d+\/)?embed\?([^#]*)/i);
    if(embedMatch){
      const params = new URLSearchParams(embedMatch[1]);
      if(!params.get('ehbc')) params.set('ehbc','2E312F');
      if(!params.get('noprof')) params.set('noprof','1');
      url = 'https://www.google.com/maps/d/u/0/embed?' + params.toString();
    }
  }
  return url;
}

/* Mapas My Maps conhecidos deste projeto — usado para reparar automaticamente
   um embedUrl ausente/quebrado em estados salvos antes desta correção. */
const KNOWN_EMBEDS = {
  'map_portobelo': 'https://www.google.com/maps/d/u/0/embed?mid=1u9-p0Km5xgn6LVQgKuS8parAPvCiL7Y&ehbc=2E312F&noprof=1'
};
function normalizeMaps(maps){
  (maps||[]).forEach(function(m){
    if(typeof m.embedUrl === 'undefined' || m.embedUrl===null) m.embedUrl = '';
    if(typeof m.source === 'undefined' || m.source===null) m.source = '';
    // Repara automaticamente mapas conhecidos que ficaram sem o link do My Maps
    // (ex.: estado salvo no navegador antes de o link ter sido cadastrado).
    if(!m.embedUrl && KNOWN_EMBEDS[m.id]){
      m.embedUrl = KNOWN_EMBEDS[m.id];
    }
    if(typeof m.backgroundMode === 'undefined' || m.backgroundMode===null){
      m.backgroundMode = m.embedUrl ? 'embed' : 'image';
    }
    if(!m.width) m.width = MAP_W_DEFAULT;
    if(!m.height) m.height = MAP_H_DEFAULT;
    if(!m.image) m.image = buildPlaceholder(m.name || 'MAPA');
    if(!m.camera || typeof m.camera.lat!=='number'){
      m.camera = parseCameraFromEmbed(m.embedUrl) || Object.assign({}, DEFAULT_CAMERA);
    }
    // Migração: mapas salvos antes desta correção podem ter ficado com a
    // câmera antiga (Chapecó) só porque nunca foi customizada manualmente.
    // Nesse caso, traz para a nova posição padrão (Porto Belo/Bombinhas).
    if(isLegacyDefaultCamera(m.camera)){
      m.camera = parseCameraFromEmbed(m.embedUrl) || Object.assign({}, DEFAULT_CAMERA);
    }
    if(!m.homeCamera || typeof m.homeCamera.lat!=='number' || isLegacyDefaultCamera(m.homeCamera)){
      m.homeCamera = Object.assign({}, m.camera);
    }
  });
  return maps;
}
/* Preenche lat/lng de pontos, vértices de ruas e de bairros que ainda não
   têm (dados antigos, de antes desta correção). Melhor esforço: assume a
   câmera atual do mapa como referência, já que não há como saber qual era
   o enquadramento do Google no momento em que cada item foi cadastrado. */
function migrateGeoData(){
  const camByMap = {};
  state.maps.forEach(function(m){
    if(m.backgroundMode==='embed' && m.camera) camByMap[m.id] = {cam:m.camera, w:m.width||MAP_W_DEFAULT, h:m.height||MAP_H_DEFAULT};
  });
  state.points.forEach(function(p){
    const ref = camByMap[p.mapId];
    if(ref && typeof p.lat!=='number'){
      const ll = mapXYToLL(p.x,p.y,ref.cam,ref.w,ref.h);
      p.lat = ll.lat; p.lng = ll.lng;
    }
  });
  state.streets.forEach(function(s){
    const ref = camByMap[s.mapId];
    if(!ref || !Array.isArray(s.points)) return;
    s.points.forEach(function(pt){
      if(typeof pt.lat!=='number'){
        const ll = mapXYToLL(pt.x,pt.y,ref.cam,ref.w,ref.h);
        pt.lat = ll.lat; pt.lng = ll.lng;
      }
    });
  });
  state.bairros.forEach(function(b){
    const ref = camByMap[b.mapId];
    if(!ref || !Array.isArray(b.polygon)) return;
    b.polygon.forEach(function(pt){
      if(typeof pt.lat!=='number'){
        const ll = mapXYToLL(pt.x,pt.y,ref.cam,ref.w,ref.h);
        pt.lat = ll.lat; pt.lng = ll.lng;
      }
    });
  });
}
function normalizeBairros(bairros){
  (bairros||[]).forEach(function(b){
    if(typeof b.population === 'undefined') b.population = null;
    if(typeof b.notes === 'undefined') b.notes = '';
    if(typeof b.source === 'undefined') b.source = '';
  });
  return bairros;
}

function loadState(){
  try{
    const candidates = [STORAGE_KEY, 'mapa_operacional_pm_v4', 'mapa_operacional_pm_v3', 'mapa_operacional_pm_v2'];
    for(let i=0;i<candidates.length;i++){
      const raw = localStorage.getItem(candidates[i]);
      if(!raw) continue;
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.maps) && parsed.maps.length && parsed.categories && parsed.points && parsed.streets){
        if(typeof parsed.streetsVisible === 'undefined') parsed.streetsVisible = true;
        if(typeof parsed.bairrosVisible === 'undefined') parsed.bairrosVisible = true;
        if(!Array.isArray(parsed.bairros)) parsed.bairros = [];
        parsed.maps = normalizeMaps(parsed.maps);
        parsed.bairros = normalizeBairros(parsed.bairros);
        parsed.version = 5;
        return parsed;
      }
    }
    const legacyRaw = localStorage.getItem('mapa_operacional_pm_v1');
    if(legacyRaw){
      const old = JSON.parse(legacyRaw);
      if(old && old.mapImage && old.categories && old.points && old.streets){
        const legacyMap = {id:'map_legacy', name:'Mapa importado', image: old.mapImage, width: MAP_W_DEFAULT, height: MAP_H_DEFAULT, source:'', embedUrl:'', backgroundMode:'image'};
        return {
          version:5,
          battalionName: old.battalionName || '',
          maps:[legacyMap],
          activeMapId: legacyMap.id,
          streetsVisible: true,
          bairrosVisible: true,
          categories: old.categories,
          points: old.points.map(function(p){ p.mapId = legacyMap.id; return p; }),
          streets: old.streets.map(function(s){ s.mapId = legacyMap.id; return s; }),
          bairros: []
        };
      }
    }
  }catch(e){ /* localStorage indisponível — segue apenas em memória */ }
  return freshState();
}

/* Em mapas "embed" (Google My Maps) o canvas preenche a área disponível da
   tela (responsivo) em vez de ter um tamanho fixo em pixels. Para que a
   reprojeção lat/lng -> pixel bata exatamente com o que o Google desenha
   (e os pontos fiquem "presos" ao lugar real, como no My Maps nativo), o
   espaço de coordenadas usado em TODA a matemática de projeção precisa ser
   o tamanho real, em pixels de tela, do canvas — não um valor fixo como
   1400x1143. Por isso, para mapas embed, mapDims() mede o elemento ao vivo
   (com um cache do último valor válido, para nunca devolver 0 durante uma
   troca de layout momentânea). Mapas de imagem estática continuam usando o
   espaço de coordenadas fixo de sempre (m.width/m.height), que é apenas uma
   ampliação visual de um fundo fixo e não precisa bater com pixels reais. */
let _lastEmbedDims = { w: MAP_W_DEFAULT, h: MAP_H_DEFAULT };
function mapDims(){
  const m = getActiveMap();
  if(m && m.backgroundMode==='embed' && m.embedUrl){
    const canvas = document.getElementById('mapCanvas');
    if(canvas){
      const rect = canvas.getBoundingClientRect();
      if(rect.width>0 && rect.height>0){
        _lastEmbedDims = { w: rect.width, h: rect.height };
      }
    }
    return _lastEmbedDims;
  }
  return { w: (m && m.width) || MAP_W_DEFAULT, h: (m && m.height) || MAP_H_DEFAULT };
}

function getCanvasPoint(e){
  const d = mapDims();
  const canvas = document.getElementById('mapCanvas');
  const rect = canvas.getBoundingClientRect();
  let x = (e.clientX-rect.left)/rect.width*d.w;
  let y = (e.clientY-rect.top)/rect.height*d.h;
  x = Math.max(0, Math.min(d.w, x));
  y = Math.max(0, Math.min(d.h, y));
  return {x:Math.round(x), y:Math.round(y)};
}

function myMapsEditUrl(embedUrl){

    // de alguns segundos, o usuário ainda esteja com a tela em branco.
    document.getElementById('embedOpenBtn').onclick = function(){

  return hay.includes(q);

    el.addEventListener('mousedown', onMarkerMouseDown);

  svg.querySelectorAll('.vertex-handle[data-street]').forEach(function(el){
    el.addEventListener('mousedown', onVertexMouseDown);
  });
}

/* ---------- Render: bairros (polígonos + rótulo com população) ---------- */
function polygonCentroid(pts){
  let x=0,y=0;
  pts.forEach(function(p){ x+=p.x; y+=p.y; });
  return {x: x/pts.length, y: y/pts.length};
}
function renderBairroPolygons(){
  const svg = document.getElementById('bairroSvg');
  svg.classList.toggle('layer-hidden', state.bairrosVisible===false);
  const d = mapDims();
  const m = getActiveMap();
  const isEmbed = !!(m && m.backgroundMode==='embed' && m.camera);
  const camera = m && m.camera;
  let html = '';
  state.bairros.forEach(function(b){
    if(b.mapId !== state.activeMapId) return;
    if(!b.polygon || b.polygon.length < 3) return;
    const proj = b.polygon.map(function(pt){ return displayXY(pt, d, camera, isEmbed); });
    const pts = proj.map(function(pt){ return pt.x+','+pt.y; }).join(' ');
    const selected = b.id===selectedBairroId;
    html += '<polygon class="bairro-hit" data-id="'+b.id+'" points="'+pts+'"></polygon>';
    html += '<polygon class="bairro '+(selected?'selected':'')+'" data-id="'+b.id+'" points="'+pts+'"></polygon>';
    const c = polygonCentroid(proj);
    html += '<text class="bairro-label" x="'+c.x+'" y="'+(c.y-4)+'" text-anchor="middle">'+esc(b.name||'Bairro')+'</text>';
    html += '<text class="bairro-label-sub" x="'+c.x+'" y="'+(c.y+13)+'" text-anchor="middle">'+esc(fmtPop(b.population))+'</text>';
    if(selected){
      proj.forEach(function(pt,idx){
        html += '<circle class="vertex-handle" data-bairro="'+b.id+'" data-idx="'+idx+'" cx="'+pt.x+'" cy="'+pt.y+'" r="7"></circle>';
      });
    }
  });
  if(mode==='draw-bairro' && draftBairroPoints.length){
    const projDraft = draftBairroPoints.map(function(pt){ return displayXY(pt, d, camera, isEmbed); });
    const pts = projDraft.map(function(pt){ return pt.x+','+pt.y; }).join(' ');
    html += '<polyline class="draft-street" points="'+pts+'"></polyline>';
    projDraft.forEach(function(pt){
      html += '<circle class="vertex-handle" cx="'+pt.x+'" cy="'+pt.y+'" r="5" style="pointer-events:none;"></circle>';
    });
  }
  svg.innerHTML = html;
  svg.querySelectorAll('.bairro-hit').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); if(mode==='select') selectBairro(el.dataset.id); });
  });
  svg.querySelectorAll('.vertex-handle[data-bairro]').forEach(function(el){
    el.addEventListener('mousedown', onBairroVertexMouseDown);
  });
}
function onBairroVertexMouseDown(e){
  e.stopPropagation();
  const bairroId = e.currentTarget.dataset.bairro;
  const idx = parseInt(e.currentTarget.dataset.idx,10);
  dragCtx = {type:'bairro-vertex', bairroId:bairroId, idx:idx, moved:false};
  window.addEventListener('mousemove', onBairroVertexMove);
  window.addEventListener('mouseup', onBairroVertexUp);
}
let _bairroVertexMoveRaf = null;
function onBairroVertexMove(e){
  if(!dragCtx || dragCtx.type!=='bairro-vertex') return;
  dragCtx.moved = true;
  dragCtx.lastEvent = e;
  if(_bairroVertexMoveRaf) return;
  _bairroVertexMoveRaf = requestAnimationFrame(function(){
    _bairroVertexMoveRaf = null;
    if(!dragCtx || dragCtx.type!=='bairro-vertex') return;
    const pt = getCanvasPoint(dragCtx.lastEvent);
    const ll = currentMapLL(pt.x, pt.y);
    if(ll){ pt.lat = ll.lat; pt.lng = ll.lng; }
    const b = state.bairros.find(function(bb){ return bb.id===dragCtx.bairroId; });
    if(b){ b.polygon[dragCtx.idx] = pt; renderBairroPolygons(); }
  });
}
function onBairroVertexUp(){
  window.removeEventListener('mousemove', onBairroVertexMove);
  window.removeEventListener('mouseup', onBairroVertexUp);
  if(_bairroVertexMoveRaf){ cancelAnimationFrame(_bairroVertexMoveRaf); _bairroVertexMoveRaf=null; }
  if(dragCtx && dragCtx.type==='bairro-vertex' && dragCtx.moved){
    const b = state.bairros.find(function(bb){ return bb.id===dragCtx.bairroId; });
    if(b){ b.updatedAt=new Date().toISOString(); saveState(); }
  }
  dragCtx = null;
}
function selectBairro(id){
  selectedBairroId = id;
  selectedPointId = null;

  renderBairroPolygons(); renderMarkers(); renderStreets();

function finishDraftBairro(){

function openBairroAssignModal(polygon){
  const mapBairros = state.bairros.filter(function(b){ return b.mapId===state.activeMapId; });

      {label:'Cancelar', kind:'ghost', onClick:function(){ closeModal(); renderBairroPolygons(); }},

          state.bairros.push(b);

/* ---------- Interação com o canvas: pan, clique, criar ponto/rua ----------
   Em mapas com fundo "Google My Maps", arrastar no modo Selecionar NÃO
   rola a tela — move a câmera geográfica (o app recalcula tudo e recarrega
   o Google Maps já centralizado no novo lugar, mantendo pontos/ruas/bairros
   alinhados). Em mapas com imagem estática, o comportamento antigo de
   rolar a viewport continua igual. */
let _panRaf = null;
function startPan(e){
  const canvas = document.getElementById('mapCanvas');
  const overlay = document.getElementById('overlayLayers');
  panMoved = false;
  if(activeIsEmbed()){
    panCtx = {embed:true, startX:e.clientX, startY:e.clientY, lastDx:0, lastDy:0};
    canvas.classList.add('panning');
    overlay.classList.add('panning');
    window.addEventListener('mousemove', onPanMove);
    window.addEventListener('mouseup', onPanEnd);
    return;
  }
  const viewport = document.getElementById('mapViewport');
  panCtx = {embed:false, startX:e.clientX, startY:e.clientY, scrollLeft:viewport.scrollLeft, scrollTop:viewport.scrollTop};
  canvas.classList.add('panning');
  window.addEventListener('mousemove', onPanMove);
  window.addEventListener('mouseup', onPanEnd);
}
function onPanMove(e){
  if(!panCtx) return;
  const dx = e.clientX - panCtx.startX;
  const dy = e.clientY - panCtx.startY;
  if(Math.abs(dx)>3 || Math.abs(dy)>3) panMoved = true;
  if(panCtx.embed){
    // A "janela" do iframe (#mapCanvas / #mapEmbedFrame) nunca é tocada aqui —
    // fica sempre fixa. Só a camada de conteúdo (#overlayLayers: pontos, ruas,
    // bairros) segue o mouse, e isso é agrupado num único requestAnimationFrame
    // por quadro (em vez de a cada mousemove) para não travar o navegador.
    panCtx.lastDx = dx; panCtx.lastDy = dy;
    if(_panRaf) return;
    _panRaf = requestAnimationFrame(function(){
      _panRaf = null;
      if(!panCtx || !panCtx.embed) return;
      document.getElementById('overlayLayers').style.transform = 'translate3d('+panCtx.lastDx+'px,'+panCtx.lastDy+'px,0)';
    });
    return;
  }
  const viewport = document.getElementById('mapViewport');
  viewport.scrollLeft = panCtx.scrollLeft - dx;
  viewport.scrollTop = panCtx.scrollTop - dy;
}
function onPanEnd(e){
  const canvas = document.getElementById('mapCanvas');
  const overlay = document.getElementById('overlayLayers');
  const wasEmbed = panCtx && panCtx.embed;
  let dx=0, dy=0;
  if(wasEmbed && e){ dx = e.clientX-panCtx.startX; dy = e.clientY-panCtx.startY; }
  canvas.classList.remove('panning');
  overlay.classList.remove('panning');
  window.removeEventListener('mousemove', onPanMove);
  window.removeEventListener('mouseup', onPanEnd);
  if(_panRaf){ cancelAnimationFrame(_panRaf); _panRaf=null; }
  overlay.style.transform = '';
  if(wasEmbed && (Math.abs(dx)>3 || Math.abs(dy)>3)){
    const m = getActiveMap();
    const rect = canvas.getBoundingClientRect();
    // Usa o tamanho real (ao vivo) do canvas, não mapDims() em cache — evita
    // qualquer descompasso entre o pixel arrastado na tela e o pixel usado
    // para calcular o novo centro geográfico.
    const centerXY = {x: rect.width/2 - dx, y: rect.height/2 - dy};
    const ll = mapXYToLL(centerXY.x, centerXY.y, m.camera, rect.width, rect.height);
    m.camera.lat = ll.lat; m.camera.lng = ll.lng;
    saveState();
    // As camadas (pontos, ruas, bairros) já são recalculadas AGORA, a partir
    // da câmera nova — não esperam o Google Maps recarregar. O iframe (fundo)
    // é atualizado em paralelo, em segundo plano, sem travar a interface.
    renderMarkers(); renderStreets(); renderBairroPolygons();
    reloadEmbedFrame();
  }
  panCtx = null;
  setTimeout(function(){ panMoved=false; }, 0);
}
function onCanvasMouseDown(e){
  if(e.target.closest('.marker') || e.target.closest('.vertex-handle')) return;
  if(mode==='select'){
    if(e.target.closest('.street-hit') || e.target.closest('.bairro-hit')) return;
    startPan(e);
  }
}
function onCanvasClick(e){
  if(panMoved) return;
  if(e.target.closest('.marker') || e.target.closest('.vertex-handle') || e.target.closest('.street-hit') || e.target.closest('.bairro-hit')) return;
  const pt = getCanvasPoint(e);
  const ll = currentMapLL(pt.x, pt.y);
  if(ll){ pt.lat = ll.lat; pt.lng = ll.lng; }
  if(mode==='add-point'){
    createPointAt(pt.x, pt.y);
  } else if(mode==='draw-street'){
    draftStreetPoints.push(pt);
    updateDraftControls();
    renderStreets();
  } else if(mode==='draw-bairro'){
    draftBairroPoints.push(pt);
    updateDraftControls();
    renderBairroPolygons();
  } else if(mode==='select'){
    if(selectedStreetId){ selectedStreetId=null; renderStreets(); }
    if(selectedBairroId){ selectedBairroId=null; renderBairroPolygons(); }
  }
}
document.getElementById('mapCanvas').addEventListener('mousedown', onCanvasMouseDown);
document.getElementById('mapCanvas').addEventListener('click', onCanvasClick);

function createPointAt(x,y){
  const ll = currentMapLL(x,y);
  const p = {
    id: uid(),
    mapId: state.activeMapId,
    categoryId: state.categories[0] ? state.categories[0].id : null,
    name:'', description:'', registro:'', address:'', mapsLink:'',
    photos:[], x:x, y:y,
    lat: ll ? ll.lat : null, lng: ll ? ll.lng : null,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  state.points.push(p);
  saveState();
  setMode('select');
  renderPointList(); renderMarkers(); renderLayers();
  openPointDrawer(p.id, true);
}

/* ---------- Arrastar marcador ---------- */
function onMarkerMouseDown(e){
  e.stopPropagation();
  if(mode!=='select') return;
  const id = e.currentTarget.dataset.id;
  dragCtx = {type:'point', id:id, moved:false, startX:e.clientX, startY:e.clientY};
  window.addEventListener('mousemove', onMarkerMove);
  window.addEventListener('mouseup', onMarkerUp);
}
let _markerMoveRaf = null;
function onMarkerMove(e){
  if(!dragCtx || dragCtx.type!=='point') return;
  const dx = Math.abs(e.clientX-dragCtx.startX), dy = Math.abs(e.clientY-dragCtx.startY);
  if(dx>4||dy>4) dragCtx.moved = true;
  if(!dragCtx.moved) return;
  dragCtx.lastEvent = e;
  if(_markerMoveRaf) return;
  _markerMoveRaf = requestAnimationFrame(function(){
    _markerMoveRaf = null;
    if(!dragCtx || dragCtx.type!=='point') return;
    const pt = getCanvasPoint(dragCtx.lastEvent);
    const p = state.points.find(function(pp){ return pp.id===dragCtx.id; });
    if(!p) return;
    p.x = pt.x; p.y = pt.y;
    const ll = currentMapLL(pt.x, pt.y);
    if(ll){ p.lat = ll.lat; p.lng = ll.lng; }
    // Move só o marcador arrastado diretamente no DOM (em vez de reconstruir
    // a camada inteira de marcadores a cada pixel do arraste) — é o que mais
    // pesava com muitos pontos cadastrados.
    const d = mapDims();
    const el = document.querySelector('.marker[data-id="'+p.id+'"]');
    if(el){ el.style.left = (pt.x/d.w*100)+'%'; el.style.top = (pt.y/d.h*100)+'%'; }
  });
}
function onMarkerUp(){
  window.removeEventListener('mousemove', onMarkerMove);
  window.removeEventListener('mouseup', onMarkerUp);
  if(_markerMoveRaf){ cancelAnimationFrame(_markerMoveRaf); _markerMoveRaf=null; }
  if(dragCtx && dragCtx.type==='point'){
    if(dragCtx.moved){
      const p = state.points.find(function(pp){ return pp.id===dragCtx.id; });
      if(p){ p.updatedAt = new Date().toISOString(); saveState(); renderMarkers(); toast('Ponto reposicionado.'); }
    } else {
      openPointDrawer(dragCtx.id);
    }
  }
  dragCtx = null;
}

/* ---------- Arrastar vértice de rua ---------- */
function onVertexMouseDown(e){
  e.stopPropagation();
  const streetId = e.currentTarget.dataset.street;
  const idx = parseInt(e.currentTarget.dataset.idx,10);
  dragCtx = {type:'vertex', streetId:streetId, idx:idx, moved:false};
  window.addEventListener('mousemove', onVertexMove);
  window.addEventListener('mouseup', onVertexUp);
}
let _vertexMoveRaf = null;
function onVertexMove(e){
  if(!dragCtx || dragCtx.type!=='vertex') return;
  dragCtx.moved = true;
  dragCtx.lastEvent = e;
  // Agrupa os pontos de rua recalculados num único requestAnimationFrame por
  // quadro — sem isso, cada pixel do mousemove disparava uma reconstrução
  // completa do SVG de ruas (incluindo as outras ruas não relacionadas).
  if(_vertexMoveRaf) return;
  _vertexMoveRaf = requestAnimationFrame(function(){
    _vertexMoveRaf = null;
    if(!dragCtx || dragCtx.type!=='vertex') return;
    const pt = getCanvasPoint(dragCtx.lastEvent);
    const ll = currentMapLL(pt.x, pt.y);
    if(ll){ pt.lat = ll.lat; pt.lng = ll.lng; }
    const s = state.streets.find(function(ss){ return ss.id===dragCtx.streetId; });
    if(s){ s.points[dragCtx.idx] = pt; renderStreets(); }
  });
}
function onVertexUp(){
  window.removeEventListener('mousemove', onVertexMove);
  window.removeEventListener('mouseup', onVertexUp);
  if(_vertexMoveRaf){ cancelAnimationFrame(_vertexMoveRaf); _vertexMoveRaf=null; }
  if(dragCtx && dragCtx.type==='vertex' && dragCtx.moved){
    const s = state.streets.find(function(ss){ return ss.id===dragCtx.streetId; });
    if(s){ s.updatedAt = new Date().toISOString(); saveState(); }
  }
  dragCtx = null;
}
function selectStreet(id){
  selectedStreetId = id;
  selectedPointId = null;
  renderStreets(); renderMarkers();
  openStreetDrawer(id);
}

/* ---------- Zoom / pan ----------
   Mapa com fundo Google My Maps: os botões de zoom mudam o zoom REAL da
   câmera (recarrega o Google Maps nesse zoom) e reprojetam pontos/ruas/
   bairros a partir de lat/lng — por isso tudo continua no lugar certo.
   Mapa com imagem estática: continua sendo o zoom de exibição (CSS) de
   sempre, que já preservava o alinhamento por ser só uma ampliação visual
   de um fundo fixo. */
function applyZoom(){
  const canvas = document.getElementById('mapCanvas');
  const viewport = document.getElementById('mapViewport');
  const d = mapDims();
  if(activeIsEmbed()){
    // Preenche a área real da tela disponível (responsivo), em vez de um
    // tamanho fixo em pixels — o espaço de coordenadas (d.w x d.h) segue
    // sendo usado só internamente para projetar lat/lng, então nada se
    // desalinha ao redimensionar.
    canvas.style.width = '';
    canvas.style.height = '';
    canvas.classList.add('embed-fill');
    viewport.classList.add('embed-fill');
    document.getElementById('zoomLevel').textContent = 'Zoom ' + Math.round(getActiveMap().camera.zoom);
  } else {
    canvas.classList.remove('embed-fill');
    viewport.classList.remove('embed-fill');
    const w = BASE_DISPLAY_W * zoomState;
    const h = w * (d.h/d.w);
    canvas.style.width = w+'px';
    canvas.style.height = h+'px';
    document.getElementById('zoomLevel').textContent = Math.round(zoomState*100)+'%';
  }
}
function changeCameraZoom(delta){
  const m = getActiveMap();
  if(!m || !m.camera) return;
  m.camera.zoom = Math.max(3, Math.min(21, Math.round(m.camera.zoom+delta)));
  saveState();
  // As camadas reagem na hora (é isso que "some junto com o zoom do iframe"
  // significa aqui); só o recarregamento pesado do Google Maps em si é
  // adiado (scheduleEmbedReload) até o usuário parar de mexer na roda/botão —
  // sem isso, cada "tick" do scroll recarregava o iframe inteiro e travava
  // o navegador durante um gesto contínuo de zoom.
  applyZoom();
  renderMarkers(); renderStreets(); renderBairroPolygons();
  scheduleEmbedReload();
}
let _embedReloadTimer = null;
function scheduleEmbedReload(){
  clearTimeout(_embedReloadTimer);
  _embedReloadTimer = setTimeout(function(){ reloadEmbedFrame(); }, 260);
}
document.getElementById('zoomIn').addEventListener('click', function(){
  if(activeIsEmbed()){ changeCameraZoom(1); return; }
  zoomState=Math.min(3, +(zoomState+0.2).toFixed(2)); applyZoom();
});
document.getElementById('zoomOut').addEventListener('click', function(){
  if(activeIsEmbed()){ changeCameraZoom(-1); return; }
  zoomState=Math.max(0.4, +(zoomState-0.2).toFixed(2)); applyZoom();
});
document.getElementById('zoomReset').addEventListener('click', function(){
  if(activeIsEmbed()){
    const m = getActiveMap();
    m.camera = Object.assign({}, m.homeCamera || DEFAULT_CAMERA);
    saveState();
    applyZoom();
    renderMarkers(); renderStreets(); renderBairroPolygons();
    clearTimeout(_embedReloadTimer);
    reloadEmbedFrame();
    return;
  }
  zoomState=1; applyZoom(); document.getElementById('mapViewport').scrollTo({left:0,top:0});
});
document.getElementById('mapViewport').addEventListener('wheel', function(e){
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  if(activeIsEmbed()){
    changeCameraZoom(e.deltaY>0 ? -1 : 1);
    return;
  }
  const delta = e.deltaY>0 ? -0.1 : 0.1;
  zoomState = Math.min(3, Math.max(0.4, +(zoomState+delta).toFixed(2)));
  applyZoom();
}, {passive:false});

/* ---------- Reprojeção ao redimensionar (embed) ----------
   Como mapDims() agora mede o tamanho real do canvas em mapas "embed", toda
   vez que esse tamanho muda (janela redimensionada, sidebar aberta/fechada,
   zoom do navegador) é preciso atualizar o viewBox dos SVGs e reprojetar
   pontos/ruas/bairros — senão eles ficam alinhados ao tamanho antigo até o
   próximo render. Isso NÃO mexe na câmera (lat/lng/zoom) nem recarrega o
   iframe: só recalcula onde cada item cai na nova área disponível. */
let _resizeRaf = null;
function reprojectEmbedLayers(){
  if(!activeIsEmbed()) return;
  const d = mapDims();
  document.getElementById('overlaySvg').setAttribute('viewBox', '0 0 '+d.w+' '+d.h);
  document.getElementById('bairroSvg').setAttribute('viewBox', '0 0 '+d.w+' '+d.h);
  renderMarkers(); renderStreets(); renderBairroPolygons();
}
function scheduleReprojectEmbedLayers(){
  if(_resizeRaf) cancelAnimationFrame(_resizeRaf);
  _resizeRaf = requestAnimationFrame(reprojectEmbedLayers);
}
if(window.ResizeObserver){
  new ResizeObserver(scheduleReprojectEmbedLayers).observe(document.getElementById('mapCanvas'));
}
window.addEventListener('resize', scheduleReprojectEmbedLayers);

/* ================= Debounce (autosave em digitação) ================= */
function debounce(fn, wait){
  let t;
  return function(){
    const args = arguments;
    clearTimeout(t);
    t=setTimeout(function(){ fn.apply(null,args); }, wait);
  };
}
const debouncedSave = debounce(function(){ saveState(); }, 500);

/* ================= Modal genérico ================= */
function openModal(title, bodyHtml, buttons, opts){
  const wide = opts && opts.wide;
  const root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal-backdrop" id="genericModalBackdrop">'
    + '<div class="modal '+(wide?'wide':'')+'">'
    + '<div class="modal-head"><span class="modal-title">'+esc(title)+'</span>'
    + '<button class="modal-close" id="genericModalClose" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg></button></div>'
    + '<div class="modal-body">'+bodyHtml+'</div>'
    + '<div class="modal-foot" id="genericModalFoot"></div>'
    + '</div></div>';
  const foot = document.getElementById('genericModalFoot');
  (buttons||[]).forEach(function(btn){
    const b = document.createElement('button');
    b.type='button';
    b.className = 'btn ' + (btn.kind||'ghost');
    b.textContent = btn.label;
    b.addEventListener('click', btn.onClick);
    foot.appendChild(b);
  });
  document.getElementById('genericModalClose').addEventListener('click', closeModal);
  document.getElementById('genericModalBackdrop').addEventListener('click', function(e){ if(e.target.id==='genericModalBackdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmAction(title, bodyHtml, onConfirm){
  openModal(title, bodyHtml, [
    {label:'Cancelar', kind:'ghost', onClick:closeModal},
    {label:'Confirmar', kind:'danger', onClick:function(){ closeModal(); onConfirm(); }}
  ]);
}
function openLightbox(src){
  const root = document.getElementById('modalRoot');
  const wrap = document.createElement('div');
  wrap.className='lightbox-backdrop';
  wrap.innerHTML = '<img src="'+src+'"><button class="lightbox-close" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg></button>';
  root.appendChild(wrap);
  const close = function(){ wrap.remove(); };
  wrap.querySelector('.lightbox-close').addEventListener('click', close);
  wrap.addEventListener('click', function(e){ if(e.target===wrap) close(); });
}

function wireCategoryRows(){
  document.querySelectorAll('#catRows .cat-row').forEach(function(row){
    const id = row.dataset.id;
    const cat = state.categories.find(function(c){ return c.id===id; });
    if(!cat) return;
    row.querySelector('[data-field="color"]').addEventListener('input', function(e){
      cat.color = e.target.value; saveState(); renderLayers(); renderPointList(); renderMarkers();
    });
    row.querySelector('[data-field="icon"]').addEventListener('change', function(e){
      cat.icon = e.target.value; saveState(); renderLayers(); renderPointList(); renderMarkers();
    });
    row.querySelector('[data-field="name"]').addEventListener('input', function(e){
      cat.name = e.target.value; saveState(); renderLayers(); renderPointList();
    });
    row.querySelector('[data-action="remove"]').addEventListener('click', function(){
      if(state.categories.length<=1){ toast('Mantenha ao menos uma categoria.'); return; }
      const inUse = state.points.filter(function(p){ return p.categoryId===cat.id; }).length;
      confirmAction('Remover categoria', '<p class="confirm-text">Remover "'+esc(cat.name)+'"?'+(inUse? ' '+inUse+' ponto(s) cadastrados nela passarão para a primeira categoria da lista.':'')+'</p>', function(){
        const fallback = state.categories.find(function(c){ return c.id!==cat.id; });
        state.points.forEach(function(p){ if(p.categoryId===cat.id) p.categoryId = fallback.id; });
        state.categories = state.categories.filter(function(c){ return c.id!==cat.id; });
        categoryFilter.delete(cat.id);
        saveState();
        renderCategoriesModal();
        renderLayers(); renderPointList(); renderMarkers();
      });
    });
  });
}

  openModal('Bairros — ' + (getActiveMap()? getActiveMap().name : ''),
    '<div class="field-hint" style="margin-bottom:10px;">Edite nome e população rapidamente aqui, ou clique num bairro no mapa para abrir os detalhes completos e desenhar/ajustar o contorno.</div>'
    + '<div id="bairroRows">'+(rowsHtml || '<div class="empty-hint">Nenhum bairro cadastrado para este mapa ainda.</div>')+'</div>'
    + '<button class="btn small ghost" id="bairroAdd" type="button" style="margin-top:10px;width:100%;justify-content:center;">+ Adicionar bairro</button>',
    [{label:'Concluído', kind:'primary', onClick:closeModal}], {wide:true}
  );
  wireBairroRows();
  document.getElementById('bairroAdd').addEventListener('click', function(){
    state.bairros.push({id:uid(), mapId:state.activeMapId, name:'Novo bairro', population:null, notes:'', source:'', polygon:null, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()});
    saveState();
    renderBairrosModal();
    renderLayers();
  });
}
function wireBairroRows(){
  document.querySelectorAll('#bairroRows .bairro-mgmt-row').forEach(function(row){
    const id = row.dataset.id;
    const b = state.bairros.find(function(x){ return x.id===id; });
    if(!b) return;
    row.querySelector('[data-field="name"]').addEventListener('input', function(e){
      b.name=e.target.value; b.updatedAt=new Date().toISOString(); debouncedSave();
      renderBairroPolygons(); renderLayers();
    });
    row.querySelector('[data-field="population"]').addEventListener('input', function(e){
      const v = e.target.value;
      b.population = v==='' ? null : Math.max(0, parseInt(v,10)||0);
      b.updatedAt=new Date().toISOString(); debouncedSave();
      renderBairroPolygons();
    });
    row.querySelector('[data-action="remove"]').addEventListener('click', function(){
      confirmAction('Excluir bairro', '<p class="confirm-text">Excluir "'+esc(b.name||'este bairro')+'" e seu contorno?</p>', function(){
        state.bairros = state.bairros.filter(function(x){ return x.id!==b.id; });
        saveState();
        renderBairrosModal();
        renderBairroPolygons(); renderLayers();
      });
    });
  });
}

/* ================= Modal: Gerenciar mapas / plano de fundo ================= */
document.getElementById('btnManageMaps').addEventListener('click', renderMapsModal);
function renderMapsModal(){
  const cardsHtml = state.maps.map(function(m){
    return '<div class="map-mgmt-card" data-id="'+m.id+'">'
      + '<div class="map-mgmt-head">'
      + '<input type="text" class="field-input" data-field="name" value="'+esc(m.name)+'" placeholder="nome do mapa / município">'
      + '<button class="icon-remove-btn" data-action="remove" title="Excluir mapa" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg></button>'
      + '</div>'
      + '<div class="map-mgmt-grid">'
      + '<div class="field"><label class="field-label">Link do Google My Maps (compartilhar, editar ou incorporar)</label>'
      + '<input type="text" class="field-input field-mono" data-field="embedUrl" value="'+esc(m.embedUrl||'')+'" placeholder="cole o link de compartilhamento, o link de incorporação ou o &lt;iframe&gt; inteiro"></div>'
      + '<div class="field-hint">Funciona com qualquer um dos três: o link de "Compartilhar" (…/edit?mid=…), o link gerado em "Incorporar no meu site" (…/embed?mid=…), ou o próprio código &lt;iframe&gt;. O sistema converte automaticamente.'
      + '<br><strong style="color:var(--text)">Importante:</strong> no Google My Maps, abra <em>Compartilhar</em> e defina o acesso como "Qualquer pessoa com o link pode ver" (mapa público). Se o mapa ficar restrito/privado, o Google bloqueia a exibição aqui dentro mesmo com o link correto.</div>'
      + (m.backgroundMode==='embed' ? (
        '<div class="field"><label class="field-label">Posição/zoom do Google Maps (referência usada para calcular a posição de cada ponto/rua/bairro)</label>'
        + '<input type="text" class="field-input field-mono" data-field="cameraPaste" placeholder="cole aqui um link do Google Maps com @latitude,longitude,zoom para centralizar">'
        + '<div style="display:flex;gap:6px;margin-top:6px;">'
        + '<input type="text" class="field-input field-mono" data-field="camLat" value="'+(m.camera?m.camera.lat.toFixed(6):'')+'" placeholder="latitude" style="flex:1;">'
        + '<input type="text" class="field-input field-mono" data-field="camLng" value="'+(m.camera?m.camera.lng.toFixed(6):'')+'" placeholder="longitude" style="flex:1;">'
        + '<input type="number" class="field-input field-mono" data-field="camZoom" value="'+(m.camera?Math.round(m.camera.zoom):14)+'" min="3" max="21" placeholder="zoom" style="width:70px;">'
        + '</div>'
        + '<div class="field-hint">Essa posição é a referência que o app usa para calcular onde cada ponto/rua/bairro cai na tela. Os botões de zoom e o arraste no mapa (modo Selecionar) já atualizam isso sozinhos — mexa aqui só para recentralizar manualmente ou corrigir algo.'
        + '<br><button class="btn small ghost" data-action="set-home" type="button" style="margin-top:6px;">Definir esta posição como padrão do botão "Centralizar"</button></div></div>'
      ) : '')
      + '<div class="field"><label class="field-label">Fonte / observação exibida no mapa</label>'
      + '<input type="text" class="field-input" data-field="source" value="'+esc(m.source||'')+'" placeholder="ex.: Google My Maps · atualizado em ..."></div>'
      + '<div class="field"><label class="field-label">Plano de fundo usado no mapa</label>'
      + '<div class="bg-mode-row">'
      + '<button type="button" class="bg-mode-btn '+(m.backgroundMode==='embed'?'active':'')+'" data-mode="embed">Google My Maps</button>'
      + '<button type="button" class="bg-mode-btn '+(m.backgroundMode==='image'?'active':'')+'" data-mode="image">Imagem estática</button>'
      + '</div></div>'
      + '<div class="map-mgmt-foot">'
      + '<button class="btn small ghost" data-action="replace-image" type="button">Substituir imagem estática</button>'
      + '<button class="btn small ghost" data-action="use" type="button">'+(m.id===state.activeMapId?'Mapa ativo':'Usar este mapa')+'</button>'
      + '</div>'
      + '</div></div>';
  }).join('');
  openModal('Gerenciar mapas e plano de fundo',
    '<div id="mapCards">'+cardsHtml+'</div>'
    + '<button class="btn small ghost" id="mapAdd" type="button" style="margin-top:10px;width:100%;justify-content:center;">+ Adicionar mapa (novo município / setor)</button>',
    [{label:'Concluído', kind:'primary', onClick:function(){ closeModal(); renderAll(); }}], {wide:true}
  );
  wireMapCards();
  document.getElementById('mapAdd').addEventListener('click', function(){
    const homeCam = Object.assign({}, DEFAULT_CAMERA);
    const nm = {id:'map_'+uid(), name:'Novo mapa', image: buildPlaceholder('NOVO MAPA'), width:MAP_W_DEFAULT, height:MAP_H_DEFAULT, source:'', embedUrl:'', backgroundMode:'image', camera: Object.assign({}, homeCam), homeCamera: homeCam};
    state.maps.push(nm);
    saveState();
    renderMapsModal();
  });
}
function wireMapCards(){
  document.querySelectorAll('#mapCards .map-mgmt-card').forEach(function(card){
    const id = card.dataset.id;
    const m = state.maps.find(function(x){ return x.id===id; });
    if(!m) return;
    card.querySelector('[data-field="name"]').addEventListener('input', function(e){
      m.name=e.target.value; saveState(); renderMapSelector();
    });
    card.querySelector('[data-field="embedUrl"]').addEventListener('input', function(e){
      const raw = e.target.value;
      m.embedUrl = normalizeEmbedUrl(raw);
      if(m.embedUrl && m.backgroundMode!=='image_forced') m.backgroundMode='embed';
      const parsedCam = parseCameraFromEmbed(raw) || parseCameraFromEmbed(m.embedUrl);
      if(parsedCam){ m.camera = parsedCam; if(!m.homeCamera) m.homeCamera = Object.assign({}, parsedCam); }
      else if(!m.camera){ m.camera = Object.assign({}, DEFAULT_CAMERA); m.homeCamera = Object.assign({}, DEFAULT_CAMERA); }
      saveState();
      if(m.id===state.activeMapId){ applyZoom(); renderMapBackground(); renderMarkers(); renderStreets(); renderBairroPolygons(); }
    });
    card.querySelector('[data-field="source"]').addEventListener('input', function(e){
      m.source=e.target.value; saveState(); if(m.id===state.activeMapId) renderMapSelector();
    });
    const camPasteEl = card.querySelector('[data-field="cameraPaste"]');
    if(camPasteEl){
      camPasteEl.addEventListener('change', function(e){
        const v = e.target.value.trim();
        const mm = v.match(/@(-?\d+\.\d+),(-?\d+\.\d+),(\d+(?:\.\d+)?)z/i) || v.match(/[?&]ll=(-?\d+\.\d+)[,\s](-?\d+\.\d+).*?[?&]z=(\d+(?:\.\d+)?)/i);
        if(!mm){ toast('Não encontrei @latitude,longitude,zoom nesse link.'); return; }
        m.camera = {lat:parseFloat(mm[1]), lng:parseFloat(mm[2]), zoom:parseFloat(mm[3])};
        if(!m.homeCamera) m.homeCamera = Object.assign({}, m.camera);
        saveState();
        renderMapsModal();
        if(m.id===state.activeMapId){ reloadEmbedFrame(); applyZoom(); renderMarkers(); renderStreets(); renderBairroPolygons(); }
        toast('Posição do mapa "'+m.name+'" atualizada.');
      });
    }
    ['camLat','camLng','camZoom'].forEach(function(f){
      const el = card.querySelector('[data-field="'+f+'"]');
      if(!el) return;
      el.addEventListener('change', function(e){
        const v = parseFloat(e.target.value);
        if(isNaN(v)) return;
        if(!m.camera) m.camera = Object.assign({}, DEFAULT_CAMERA);
        if(f==='camLat') m.camera.lat = v;
        if(f==='camLng') m.camera.lng = v;
        if(f==='camZoom') m.camera.zoom = Math.max(3, Math.min(21, Math.round(v)));
        saveState();
        if(m.id===state.activeMapId){ reloadEmbedFrame(); applyZoom(); renderMarkers(); renderStreets(); renderBairroPolygons(); }
      });
    });
    const setHomeBtn = card.querySelector('[data-action="set-home"]');
    if(setHomeBtn){
      setHomeBtn.addEventListener('click', function(){
        m.homeCamera = Object.assign({}, m.camera || DEFAULT_CAMERA);
        saveState();
        toast('Posição padrão de "'+m.name+'" atualizada.');
      });
    }
    card.querySelectorAll('.bg-mode-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const wanted = btn.dataset.mode;
        if(wanted==='embed' && !m.embedUrl){ toast('Cole o link do Google My Maps antes de usá-lo como fundo.'); return; }
        m.backgroundMode = wanted;
        saveState();
        renderMapsModal();
        if(m.id===state.activeMapId) renderMapBackground();
      });
    });
    card.querySelector('[data-action="replace-image"]').addEventListener('click', function(){
      const input = document.getElementById('mapImageInput');
      input.onchange = function(){
        const file = input.files && input.files[0];
        if(!file) return;
        fileToDataUrl(file).then(function(dataUrl){ return downscaleImage(dataUrl, 2200); }).then(function(r){
          m.image = r.url; m.width = r.w; m.height = r.h;
          saveState();
          toast('Imagem do mapa "'+m.name+'" atualizada.');
          if(m.id===state.activeMapId) renderMapBackground();
        }).catch(function(){ toast('Não foi possível carregar a imagem.'); });
        input.value='';
      };
      input.click();
    });
    card.querySelector('[data-action="use"]').addEventListener('click', function(){
      state.activeMapId = m.id;
      selectedPointId=null; selectedStreetId=null; selectedBairroId=null;
      closeDrawers();
      saveState();
      zoomState=1;
      closeModal();
      renderAll();
    });
    card.querySelector('[data-action="remove"]').addEventListener('click', function(){
      if(state.maps.length<=1){ toast('Mantenha ao menos um mapa.'); return; }
      const nPts = state.points.filter(function(p){ return p.mapId===m.id; }).length;
      const nStr = state.streets.filter(function(s){ return s.mapId===m.id; }).length;
      const nBai = state.bairros.filter(function(b){ return b.mapId===m.id; }).length;
      confirmAction('Excluir mapa', '<p class="confirm-text">Excluir "'+esc(m.name)+'"? Isso removerá também '+nPts+' ponto(s), '+nStr+' rua(s) e '+nBai+' bairro(s) associados a ele.</p>', function(){
        state.maps = state.maps.filter(function(x){ return x.id!==m.id; });
        state.points = state.points.filter(function(p){ return p.mapId!==m.id; });
        state.streets = state.streets.filter(function(s){ return s.mapId!==m.id; });
        state.bairros = state.bairros.filter(function(b){ return b.mapId!==m.id; });
        if(state.activeMapId===m.id) state.activeMapId = state.maps[0].id;
        saveState();
        renderMapsModal();
        renderAll();
      });
    });
  });
}

/* ================= Exportar / Importar backup ================= */
document.getElementById('btnExport').addEventListener('click', function(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = 'mapa-operacional-backup-'+stamp+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('Backup exportado.');
  }catch(e){ toast('Não foi possível exportar o backup.'); }
});
document.getElementById('btnImport').addEventListener('click', function(){
  confirmAction('Importar backup', '<p class="confirm-text">Selecionar um arquivo .json substituirá TODOS os dados atuais (mapas, pontos, ruas e bairros) por aqueles do backup. Recomenda-se exportar um backup atual antes de continuar.</p>', function(){
    document.getElementById('importInput').click();
  });
});
document.getElementById('importInput').addEventListener('change', function(){
  const file = this.files && this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.maps) || !parsed.categories || !parsed.points || !parsed.streets){
        toast('Arquivo inválido: estrutura de backup não reconhecida.'); return;
      }
      if(typeof parsed.streetsVisible === 'undefined') parsed.streetsVisible = true;
      if(typeof parsed.bairrosVisible === 'undefined') parsed.bairrosVisible = true;
      if(!Array.isArray(parsed.bairros)) parsed.bairros = [];
      parsed.maps = normalizeMaps(parsed.maps);
      parsed.bairros = normalizeBairros(parsed.bairros);
      parsed.version = 5;
      state = parsed;
      if(!state.maps.find(function(m){ return m.id===state.activeMapId; })) state.activeMapId = state.maps[0].id;
      migrateGeoData();
      categoryFilter = new Set(state.categories.map(function(c){ return c.id; }));
      selectedPointId=null; selectedStreetId=null; selectedBairroId=null;
      zoomState=1;
      saveState();
      closeDrawers();
      renderAll();
      toast('Backup importado com sucesso.');
    }catch(e){ toast('Não foi possível importar: arquivo inválido.'); }
    document.getElementById('importInput').value='';
  };
  reader.readAsText(file);
});

/* ================= Menu mobile ================= */
document.getElementById('sidebarToggle').addEventListener('click', function(){
  document.getElementById('sidebar').classList.toggle('show');
});

/* ================= Inicialização ================= */
renderAll();
</script>
</body>
